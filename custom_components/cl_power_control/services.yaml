add_load:
  name: Aggiungi carico
  description: Aggiunge un carico a CL Power Control dalla dashboard installatore.
  fields:
    entry_id:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    command_entity:
      required: true
      selector:
        entity:
          domain:
            - switch
            - light
    power_sensor:
      required: false
      selector:
        entity:
          domain: sensor
          device_class: power

remove_load:
  name: Rimuovi carico
  description: Rimuove un carico da CL Power Control dalla dashboard installatore.
  fields:
    entry_id:
      required: true
      selector:
        text:
    load_id:
      required: true
      selector:
        text:
